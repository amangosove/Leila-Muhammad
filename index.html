<style>
/* Layout: photo-led hero (arch frame with glass age chips), marquee strip, bento tiles for the facts, deep-green tusau panel, RSVP card. */
:root{
  --bg:#F7F3EB; --surface:#FFFFFF; --ink:#12281F; --muted:#56685F; --line:#DED6C4; --soft:#EFE7D5;
  --accent:#1F5C47; --on-accent:#F7F3EB; --gold:#B0822A; --gold-ink:#7A5A17;
  --deep:#12382C; --on-deep:#F3EDE0; --deep-muted:#A9C0B5; --gold-bright:#E0B766;
  --glass:rgba(10,24,18,.58); --glass-line:rgba(255,255,255,.28); --danger:#A3261F;
  --font-display:"Noto Serif Display", Georgia, "Times New Roman", serif;
  --font-body:"Manrope", system-ui, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B1712; --surface:#14291F; --ink:#F3EDE0; --muted:#A3B7AD; --line:#244235; --soft:#1B382B;
    --accent:#E0B766; --on-accent:#14261D; --gold:#E0B766; --gold-ink:#E0B766;
    --deep:#0F2A20; --glass:rgba(10,24,18,.62); --danger:#FF9B93;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B1712; --surface:#14291F; --ink:#F3EDE0; --muted:#A3B7AD; --line:#244235; --soft:#1B382B;
  --accent:#E0B766; --on-accent:#14261D; --gold:#E0B766; --gold-ink:#E0B766;
  --deep:#0F2A20; --glass:rgba(10,24,18,.62); --danger:#FF9B93;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  background:var(--bg); color:var(--ink);
  font:500 17px/1.55 var(--font-body);
  padding-block:16px 120px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  overflow-x:hidden;
}
h1,h2,h3,p{margin:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.sprite{position:absolute;width:0;height:0;overflow:hidden}

.orbs{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.orb{position:absolute;border-radius:50%;filter:blur(60px);opacity:.28;background:radial-gradient(circle,var(--gold) 0,transparent 68%);animation:drift 22s ease-in-out infinite alternate}
.orb.a{width:420px;height:420px;left:-160px;top:-80px}
.orb.b{width:360px;height:360px;right:-140px;top:38%;animation-duration:28s;animation-delay:-8s;background:radial-gradient(circle,var(--accent) 0,transparent 68%);opacity:.2}
.orb.c{width:300px;height:300px;left:20%;bottom:-120px;animation-duration:25s;animation-delay:-14s}
@keyframes drift{from{transform:translate(0,0) scale(1)}to{transform:translate(50px,-40px) scale(1.15)}}

.page{position:relative;z-index:1;max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:56px}
.page > *{min-width:0}

.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px}
.date-mini{font-weight:800;letter-spacing:.18em;font-size:13px;color:var(--gold-ink);text-transform:uppercase}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--surface)}
.lang button{border:0;background:transparent;color:var(--muted);font:800 13px var(--font-body);letter-spacing:.08em;padding:0 14px;min-height:36px;border-radius:999px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}

/* hero */
.hero{display:grid;gap:32px;align-items:center}
.hero-copy{display:flex;flex-direction:column;gap:18px;align-items:flex-start}
.eyebrow{font-size:13px;font-weight:800;letter-spacing:.22em;text-transform:uppercase;color:var(--gold-ink)}
h1{font-family:var(--font-display);font-weight:600;font-size:clamp(46px,13vw,104px);line-height:.95;display:flex;flex-direction:column;letter-spacing:-.01em}
h1 .hrow{display:flex;flex-wrap:wrap;align-items:baseline;column-gap:.28em}
h1 .hrow i{font-style:italic;font-weight:400;color:var(--gold);font-size:.5em;line-height:1.1}
h1 .hrow + .hrow{margin-top:.12em}
.sub{font-size:19px;max-width:30ch;color:var(--muted)}
.sub b{color:var(--ink);font-weight:700}
.invite{max-width:42ch;color:var(--muted)}
.hero-actions{display:flex;flex-wrap:wrap;gap:10px}

.photo{position:relative;max-width:480px;width:100%;margin:0 auto}
.frame{
  position:relative;aspect-ratio:3/4;border-radius:999px 999px 32px 32px;overflow:hidden;
  background:var(--soft);box-shadow:0 30px 60px -30px rgba(10,30,20,.55);
  transform:perspective(900px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));
  transition:transform .25s ease-out;
}
.frame img{display:block;width:100%;height:100%;object-fit:cover;max-width:100%}
.ring{position:absolute;inset:-12px;border:1.5px solid var(--gold);border-radius:999px 999px 40px 40px;opacity:.7;pointer-events:none}
.chip{
  position:absolute;bottom:16px;display:flex;align-items:center;gap:10px;padding:8px 16px 8px 10px;border-radius:999px;
  background:var(--glass);border:1px solid var(--glass-line);color:#F3EDE0;
  -webkit-backdrop-filter:blur(14px) saturate(1.3);backdrop-filter:blur(14px) saturate(1.3);
  animation:bob 5s ease-in-out infinite;
}
.chip .n{display:grid;place-items:center;width:40px;height:40px;border-radius:50%;background:#E0B766;color:#14261D;font:600 22px var(--font-display)}
.chip .w{display:flex;flex-direction:column;line-height:1.15}
.chip .w small{font-size:11px;letter-spacing:.1em;text-transform:uppercase;opacity:.8}
.chip .w span{font-weight:800;font-size:15px}
.chip.l{left:-6px}
.chip.r{right:-6px;animation-delay:-2.4s}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 26px;border:0;border-radius:999px;
  background:var(--accent);color:var(--on-accent);font:800 16px var(--font-body);cursor:pointer;text-decoration:none;
}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn svg{width:20px;height:20px;flex:none}
.btn:disabled{opacity:.5}

/* marquee */
.marquee{overflow:hidden;border-block:1px solid var(--line);padding:14px 0;margin-inline:calc(-1 * max(16px, env(safe-area-inset-left, 0px)))}
.track{display:flex;width:max-content;animation:run 32s linear infinite}
.track span{font:italic 400 clamp(22px,5vw,34px) var(--font-display);white-space:nowrap;padding-right:36px;color:var(--ink)}
.track span i{font-style:normal;color:var(--gold);padding-left:36px}
@keyframes run{to{transform:translateX(-50%)}}

/* bento */
.sec-h{display:flex;flex-direction:column;gap:8px;margin-bottom:20px}
h2{font-family:var(--font-display);font-weight:600;font-size:clamp(30px,7vw,48px);line-height:1.08;text-wrap:balance}
.bento{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:26px;padding:20px;display:flex;flex-direction:column;justify-content:space-between;gap:14px;min-width:0}
.tile .k{font-size:12px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.tile .big{font-family:var(--font-display);font-weight:600;font-size:clamp(52px,14vw,84px);line-height:.9;font-variant-numeric:tabular-nums}
.tile .sm{font-size:16px;color:var(--muted)}
.t-date{background:var(--deep);border-color:transparent;color:var(--on-deep)}
.t-date .k,.t-date .sm{color:var(--deep-muted)}
.t-time{background:var(--soft)}
.t-place{grid-column:span 2}
.t-place .name{font-family:var(--font-display);font-weight:600;font-size:clamp(30px,8vw,44px);line-height:1.05}
.t-place .row{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:14px}
.t-age .big{color:var(--gold)}
.t-age .who{font-weight:800;font-size:19px}
.t-count{grid-column:span 2}
.count{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.cell{text-align:center;background:var(--bg);border-radius:16px;padding:14px 2px 10px}
.cell .num{font-family:var(--font-display);font-weight:600;font-size:clamp(28px,8vw,44px);line-height:1;font-variant-numeric:tabular-nums}
.cell .lab{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-top:8px}
.started{font-family:var(--font-display);font-size:30px;color:var(--gold-ink)}

/* tusau */
.tusau{background:var(--deep);color:var(--on-deep);border-radius:36px;padding:36px 20px;display:grid;gap:28px;align-items:center;overflow:hidden;position:relative}
.tusau .eyebrow{color:var(--gold-bright)}
.tusau h2{color:var(--on-deep)}
.tusau p{color:var(--deep-muted);max-width:46ch}
.tusau .btn{background:var(--gold-bright);color:#14261D}
.tcopy{display:flex;flex-direction:column;gap:16px;align-items:flex-start}
.scene{width:100%;max-width:360px;margin:0 auto}
.scene svg{display:block;width:100%;height:auto;overflow:visible}
.blessing{font:italic 400 24px/1.25 var(--font-display);color:var(--gold-bright);min-height:1.3em;opacity:0;transition:opacity .6s .5s}
.tusau.cut .blessing{opacity:1}
.half{transition:transform .9s cubic-bezier(.2,.8,.2,1)}
.half-l{transform-origin:30px 110px}
.half-r{transform-origin:290px 110px}
.cut .half-l{transform:translate(-16px,12px) rotate(-6deg)}
.cut .half-r{transform:translate(16px,12px) rotate(6deg)}
.fp{opacity:.9;color:var(--gold-bright)}
.fp2{opacity:0;color:var(--gold-bright)}
.cut .fp2{animation:step .5s ease-out forwards;animation-delay:calc(var(--i) * .3s + .5s)}
@keyframes step{from{opacity:0}to{opacity:.9}}

/* rsvp */
.rsvp{background:var(--surface);border:1px solid var(--line);border-radius:32px;padding:28px 20px;display:flex;flex-direction:column;gap:22px;max-width:680px;width:100%;margin:0 auto}
.form{display:flex;flex-direction:column;gap:20px}
.opts{display:flex;flex-direction:column;gap:10px;border:0;padding:0;margin:0;min-width:0}
.opts legend{padding:0;margin-bottom:10px;font-weight:800}
.opt{position:relative;display:flex;align-items:center;gap:12px;min-height:56px;padding:12px 16px;border:1.5px solid var(--line);border-radius:16px;cursor:pointer;background:var(--surface)}
.opt input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer}
.opt:has(input:checked){border-color:var(--accent);background:var(--soft)}
.opt:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:2px}
.dot{width:22px;height:22px;flex:none;border-radius:50%;border:2px solid var(--muted)}
.opt:has(input:checked) .dot{border-color:var(--accent);background:radial-gradient(var(--accent) 0 42%, transparent 46%)}
.opt.check .dot{border-radius:7px}
.opt.check:has(input:checked) .dot{background:var(--accent);border-color:var(--accent)}
.opt.check:has(input:checked) .dot::after{content:"";display:block;width:5px;height:10px;border:solid var(--on-accent);border-width:0 2.5px 2.5px 0;transform:translate(5px,1px) rotate(45deg)}
.family{display:flex;flex-direction:column;gap:12px;padding:16px;border-radius:18px;background:var(--bg)}
.family[hidden]{display:none}
.family h3{font-size:17px;font-weight:800}
.row2{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.stepper{display:inline-flex;align-items:center;border:1.5px solid var(--line);border-radius:999px;background:var(--surface)}
.stepper button{width:48px;height:48px;border:0;background:transparent;color:var(--accent);font:800 24px/1 var(--font-body);cursor:pointer;border-radius:50%}
.stepper output{min-width:34px;text-align:center;font-weight:800;font-size:19px;font-variant-numeric:tabular-nums}
.total{padding:12px 16px;border-radius:12px;background:var(--soft);font-weight:800}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:800}
input[type="text"],textarea{font:500 17px/1.4 var(--font-body);color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:14px;padding:12px 16px;width:100%;min-height:50px}
textarea{resize:vertical;min-height:84px}
.err{color:var(--danger);min-height:1.4em;font-size:16px;font-weight:700}
.result{display:flex;flex-direction:column;gap:16px}
.result .sub{max-width:none}
.msg{white-space:pre-wrap;background:var(--bg);border:1.5px dashed var(--line);border-radius:16px;padding:14px 16px;font-size:16px;user-select:text;overflow-wrap:anywhere}
.actions{display:flex;flex-wrap:wrap;gap:10px}
.copyhint{color:var(--muted);font-size:15px;min-height:1.3em}

.foot{text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center}
.foot .big{font:italic 400 clamp(26px,6vw,36px) var(--font-display);color:var(--gold-ink)}
.foot .sig{font-size:13px;letter-spacing:.2em;text-transform:uppercase;font-weight:800;color:var(--muted)}

/* floating reply button */
.cta{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:center;pointer-events:none;
  padding:12px max(16px, env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  transform:translateY(130%);opacity:0;transition:transform .4s ease,opacity .4s ease}
.cta.on{transform:none;opacity:1}
.cta .btn{pointer-events:auto;box-shadow:0 12px 30px -10px rgba(10,30,20,.55)}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:40}

/* scroll reveal, resting state stays readable */
@supports (animation-timeline: view()){
  .rv{animation:rv linear both;animation-timeline:view();animation-range:entry 0% entry 45%}
  @keyframes rv{from{opacity:.35;transform:translateY(34px)}to{opacity:1;transform:none}}
}

@media (min-width:860px){
  .hero{grid-template-columns:1.1fr .9fr;gap:56px}
  .bento{grid-template-columns:repeat(4,minmax(0,1fr))}
  .t-place{grid-column:span 2}
  .t-count{grid-column:span 2}
  .tusau{grid-template-columns:1.1fr .9fr;padding:56px}
}
@media (prefers-reduced-motion: reduce){
  html{scroll-behavior:auto}
  .orb,.chip,.track{animation:none}
  .half,.blessing,.frame,.cta{transition:none}
  .cut .fp2{animation:none;opacity:.9}
  .rv{animation:none}
}
</style>

  /* events */
  $("lang-kk").addEventListener("click", function () { lang = "kk"; store("ml-lang", lang); render(); });
  $("lang-ru").addEventListener("click", function () { lang = "ru"; store("ml-lang", lang); render(); });

  $("cutBtn").addEventListener("click", function () {
    cut = !cut;
    $("tusau").classList.toggle("cut", cut);
    $("cutLabel").textContent = cut ? T[lang].again : T[lang].cut;
    if (cut) { burst(); }
  });

  Array.prototype.forEach.call(document.querySelectorAll('input[name="coming"]'), function (r) {
    r.addEventListener("change", function () {
      choice = r.value;
      $("family").hidden = choice !== "yes";
      $("err").textContent = "";
    });
  });
  function updateTotal() { $("total").textContent = T[lang].total(total()); }
  $("spouse").addEventListener("change", updateTotal);
  $("kMinus").addEventListener("click", function () { kids = Math.max(0, kids - 1); $("kOut").textContent = kids; updateTotal(); });
  $("kPlus").addEventListener("click", function () { kids = Math.min(8, kids + 1); $("kOut").textContent = kids; updateTotal(); });

  var saved = store("ml-name");
  if (saved) { $("guest").value = saved; }

  $("form").addEventListener("submit", async function (e) {
    e.preventDefault();
    var t = T[lang];
    if (!$ ("guest").value.trim()) { $("err").textContent = t.errName; $("guest").focus(); return; }
    if (!choice) { $("err").textContent = t.errChoice; return; }
    if (!SHEETS_WEB_APP_URL || SHEETS_WEB_APP_URL.indexOf("https://script.google.com/macros/s/") !== 0) { $("err").textContent = t.errSetup; return; }
    var submitBtn = $("form").querySelector('button[type="submit"]');
    var originalLabel = submitBtn.textContent;
    submitBtn.disabled = true; submitBtn.textContent = t.sending; $("err").textContent = "";
    var payload = {
      submittedAt: new Date().toISOString(), language: lang,
      guestName: $("guest").value.trim(), attendance: choice,
      adults: choice === "yes" ? 1 + ($("spouse").checked ? 1 : 0) : 0,
      children: choice === "yes" ? kids : 0,
      totalGuests: choice === "yes" ? total() : 0,
      note: $("note").value.trim(), event: "Мухаммад пен Лейла — 07.11.2026"
    };
    try {
      /* text/plain avoids a CORS preflight; Apps Script records the POST server-side. */
      await fetch(SHEETS_WEB_APP_URL, { method: "POST", mode: "no-cors", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(payload) });
      store("ml-name", $("guest").value.trim()); resultShown = true; showResult();
      $("form").hidden = true; $("result").hidden = false; $("copyHint").textContent = "";
      $("result").scrollIntoView({ behavior: reduce ? "auto" : "smooth", block: "nearest" });
      if (choice === "yes") { burstAt($("result")); }
    } catch (err) {
      $("err").textContent = t.errSend;
    } finally { submitBtn.disabled = false; submitBtn.textContent = originalLabel; }
  });
  function burstAt(el) {
    if (reduce) { return; }
    var b = el.getBoundingClientRect();
    var cols = ["#E0B766", "#1F5C47", "#F3E3B3", "#52C6DE"];
    for (var i = 0; i < 60; i++) {
      var a = -Math.PI / 2 + (Math.random() - 0.5) * 2.2, v = 4 + Math.random() * 8;
      parts.push({ x: b.left + b.width / 2, y: Math.min(window.innerHeight * 0.6, Math.max(80, b.top + 40)), vx: Math.cos(a) * v, vy: Math.sin(a) * v,
        r: 3 + Math.random() * 3.5, rot: Math.random() * 6, vr: (Math.random() - 0.5) * 0.3, c: cols[i % cols.length], coin: Math.random() < 0.4, life: 0 });
    }
    if (!raf) { raf = requestAnimationFrame(frame); }
  }
  $("editBtn").addEventListener("click", function () {
    resultShown = false;
    $("result").hidden = true;
    $("form").hidden = false;
  });
  $("copyBtn").addEventListener("click", function () {
    var text = $("msg").textContent, hint = $("copyHint");
    function fallback() {
      var range = document.createRange(); range.selectNodeContents($("msg"));
      var sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(range);
      hint.textContent = T[lang].copyFail;
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { hint.textContent = T[lang].copied; }, fallback);
    } else { fallback(); }
  });

  /* photo tilt on pointer devices */
  var frameEl = $("frame");
  if (!reduce && window.matchMedia && window.matchMedia("(hover: hover)").matches) {
    $("photo").addEventListener("pointermove", function (e) {
      var b = frameEl.getBoundingClientRect();
      var x = (e.clientX - b.left) / b.width - 0.5, y = (e.clientY - b.top) / b.height - 0.5;
      frameEl.style.setProperty("--ry", (x * 8).toFixed(2) + "deg");
      frameEl.style.setProperty("--rx", (-y * 8).toFixed(2) + "deg");
    });
    $("photo").addEventListener("pointerleave", function () {
      frameEl.style.setProperty("--ry", "0deg"); frameEl.style.setProperty("--rx", "0deg");
    });
  }

  /* floating reply button: visible between the hero and the form */
  if ("IntersectionObserver" in window) {
    var vis = { hero: true, rsvp: false };
    var upd = function () { $("cta").classList.toggle("on", !vis.hero && !vis.rsvp); };
    new IntersectionObserver(function (en) { vis.hero = en[0].isIntersecting; upd(); }).observe($("hero"));
    new IntersectionObserver(function (en) { vis.rsvp = en[0].isIntersecting; upd(); }, { threshold: 0.15 }).observe($("rsvp"));
  }

  window.addEventListener("resize", sizeCanvas);
  sizeCanvas();
  render();
  setInterval(tick, 1000);
})();
</script>

</body></html>
